# "What's the temperature in the garage?" Home Assistant's built-in version of
# this only looks at thermostats; this one reads the temperature sensors in the
# named area. Handler: GetAreaTemperature in intent_scripts.yaml.
language: "en"
intents:
  GetAreaTemperature:
    data:
      - sentences:
          - "(what's|whats|what is|how warm is|how cold is|how hot is) [the] temperature (in|of) [the] {area}"
          - "(what's|whats|what is) [the] temp (in|of) [the] {area}"
          - "how (warm|cold|hot) is [it in] [the] {area}"
          - "(what's|whats|what is) [the] {area} temperature"
      - sentences:
          - "(what's|whats|what is) [the] temperature outside"
          - "how (warm|cold|hot) is it outside"
          - "(what's|whats|what is) it like outside"
        slots:
          area: "outside"
