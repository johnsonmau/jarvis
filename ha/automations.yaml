- id: jarvis_transcript_webhook
  alias: Jarvis - transcript relay
  description: Stores what Jarvis heard and said (posted by the jarvis-micwatch container
    from the satellite log) for the "what did you hear" intent and the face caption.
  triggers:
  - trigger: webhook
    webhook_id: jarvis-transcript
    allowed_methods:
    - POST
    local_only: true
  conditions:
  - condition: template
    value_template: '{{ trigger.json is defined and trigger.json.text is defined }}'
  actions:
  - choose:
    - conditions: '{{ trigger.json.kind == ''heard'' }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.jarvis_prev_heard
        data:
          value: '{{ states(''input_text.jarvis_last_heard'') }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.jarvis_last_heard
        data:
          value: '{{ trigger.json.text | truncate(250, true, '''') }}'
    - conditions: '{{ trigger.json.kind == ''said'' }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.jarvis_last_said
        data:
          value: '{{ trigger.json.text | truncate(250, true, '''') }}'
  mode: queued
  max: 10
