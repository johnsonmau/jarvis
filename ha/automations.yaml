- id: jarvis_satellite_watchdog
  alias: Jarvis satellite watchdog
  description: If the USB-mic satellite sits in listening/processing/responding too
    long (happens when 'hey jarvis' is said again before the previous reply finished),
    reload its Wyoming entry so both sides reset.
  triggers:
  - trigger: state
    entity_id: assist_satellite.usb_mic
    to: listening
    for:
      seconds: 25
  - trigger: state
    entity_id: assist_satellite.usb_mic
    to: processing
    for:
      seconds: 60
  - trigger: state
    entity_id: assist_satellite.usb_mic
    to: responding
    for:
      seconds: 90
  conditions: []
  actions:
  - action: logbook.log
    data:
      name: Jarvis watchdog
      message: satellite stuck in {{ trigger.to_state.state }}, reloading the Wyoming
        entry
      entity_id: assist_satellite.usb_mic
  - action: homeassistant.reload_config_entry
    data:
      entry_id: 01M2B55JHZNZJ1F095GEAQ3MHY
  mode: single
