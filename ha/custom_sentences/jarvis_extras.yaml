# Jarvis extras: "what did you hear", his own volume, reminders, music.
# Handlers in intent_scripts.yaml (Jarvis* entries). Reload with
# conversation.reload (sentences) and intent_script.reload.
# The built-in intents already cover timers ("set a timer for 10 minutes",
# "cancel the timer") and media ("pause", "resume", "next track", "set volume
# to 50 percent" for the office speaker), so they are not repeated here.
language: "en"
# Ignored during matching, so "hey Jarvis, turn off the TV" said inside a
# follow-up window (no wake-word detection, phrase ends up in the transcript)
# still matches the intent.
skip_words:
  - "hey jarvis"
  - "jarvis"
  - "please"
expansion_rules:
  pre: "[(can|could|would|will) you] [please]"
  post: "[please] [now]"
lists:
  # Parakeet often hears "volume" as "value" or "bound"; accept them all
  vol:
    values:
      - in: "(volume|volumes|value|values|bound|voice|loudness)"
        out: "volume"
  level:
    range:
      from: 0
      to: 100
  minutes:
    range:
      from: 1
      to: 720
  hours:
    range:
      from: 1
      to: 24
  task:
    wildcard: true
  # Parakeet writes "TV" as "T V"; hassil will not match that against an alias, so map it here
  tvroom:
    values:
      - in: "bedroom"
        out: "media_player.bedroom_tv"
      - in: "living room"
        out: "media_player.living_room_tv"
  tvpower:
    values:
      - in: "on"
        out: "on"
      - in: "off"
        out: "off"
intents:
  JarvisWhatHeard:
    data:
      - sentences:
          - "what did you [just] hear"
          - "what did I [just] say"
          - "what do you think I said"
          - "repeat what I said"
          - "what did you hear me say"
  JarvisWhatSaid:
    data:
      - sentences:
          - "what did you [just] say"
          - "(repeat|say) that [again]"
          - "come again"
          - "say again"
  JarvisVolumeUp:
    data:
      - sentences:
          - "<pre> [a (bit|little)] louder <post>"
          - "<pre> speak (up|louder) <post>"
          - "<pre> (turn|bring) (yourself|your volume|your voice) up [a (bit|little)] <post>"
          - "<pre> (raise|increase|boost) your {vol} [a (bit|little)] <post>"
          - "<pre> [your] {vol} up <post>"
          - "I can't hear you"
          - "(you're|you are) [being] too quiet"
  JarvisVolumeDown:
    data:
      - sentences:
          - "<pre> [a (bit|little)] (quieter|softer) <post>"
          - "<pre> not so loud <post>"
          - "<pre> (turn|bring) (yourself|your volume|your voice) down [a (bit|little)] <post>"
          - "<pre> (lower|reduce|decrease|drop) your {vol} [a (bit|little) [bit]] <post>"
          - "<pre> [your] {vol} down <post>"
          - "<pre> keep it down <post>"
          - "(you're|you are) [being] too loud"
          - "<pre> speak (quieter|softer|more quietly) <post>"
  JarvisVolumeSet:
    data:
      - sentences:
          - "<pre> set your {vol} to {level} [percent] <post>"
          - "<pre> [put] your {vol} (at|to) {level} [percent] <post>"
          - "<pre> speak at {level} percent <post>"
  JarvisVolumeGet:
    data:
      - sentences:
          - "(what's|what is) your {vol}"
          - "how loud are you"
  JarvisRemind:
    data:
      - sentences:
          - "remind me to {task} in {minutes} minute[s]"
          - "remind me in {minutes} minute[s] to {task}"
          - "(set|create|make) a reminder to {task} in {minutes} minute[s]"
          - "in {minutes} minute[s] remind me to {task}"
      - sentences:
          - "remind me to {task} in {hours} hour[s]"
          - "remind me in {hours} hour[s] to {task}"
          - "(set|create|make) a reminder to {task} in {hours} hour[s]"
          - "in {hours} hour[s] remind me to {task}"
  JarvisNowPlaying:
    data:
      - sentences:
          - "(what's|what is) playing"
          - "what (song|track) is this"
          - "what is this [song|track]"
          - "who is this"
          - "who sings this"
  JarvisPlayMusic:
    data:
      - sentences:
          - "(play|start|resume) [some|the] music"
          - "put [some] music on"
          - "music on"
  JarvisTv:
    data:
      - sentences:
          - "turn {tvpower} [the] {tvroom} (t v|tee vee|t. v.)"
          - "turn [the] {tvroom} (t v|tee vee|t. v.) {tvpower}"
          - "(switch|power|shut) {tvpower} [the] {tvroom} (t v|tee vee|t. v.)"
